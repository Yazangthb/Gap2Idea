[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gap2idea"
version = "0.2.0"
description = "Mine research gaps from papers and synthesise novel research ideas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yazan Nukari" }]
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "sentence-transformers",
  "hdbscan",
  "plotly",
  "streamlit",
  "pymupdf",
  "openai",
  "python-dotenv",
  "requests",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
gap2idea = "gap2idea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
