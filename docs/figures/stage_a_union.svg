<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:15px;font-weight:700;fill:#111827}
    .s{font-size:12px;fill:#374151}
    .sm{font-size:10.5px;fill:#4b5563}
    .lbl{font-size:11px;font-weight:600}
    .cell{stroke:#94a3b8;stroke-width:.6}
  </style>

  <text x="20" y="28" class="t">Stage A — how three recall sources select gap sentences from a paper</text>
  <text x="20" y="48" class="s">Each small box is one sentence in reading order (1 → N). Only the shaded ones survive into Stage B.</text>

  <!-- brackets / source annotations -->
  <!-- keyword window over cells 17-19 (x index 16..18) -->
  <path d="M360,92 v-10 h60 v10" fill="none" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="390" y="78" text-anchor="middle" class="lbl" fill="#7c3aed">inline keyword "future work" (±5)</text>
  <!-- heading span over cells 31-38 (x 640..800) -->
  <path d="M640,92 v-10 h160 v10" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <text x="720" y="78" text-anchor="middle" class="lbl" fill="#2563eb">heading "Limitations" → +span</text>
  <!-- terminal tail over cells 35-40 (x 720..840) -->
  <path d="M720,150 v10 h120 v-10" fill="none" stroke="#16a34a" stroke-width="1.4"/>
  <text x="780" y="178" text-anchor="middle" class="lbl" fill="#16a34a">terminal tail (last N)</text>

  <!-- the sentence stream: 40 cells, x = 40 + i*20, width 18, y=100 h=40 -->
  <g class="cell">
    <!-- dropped cells 1-16 -->
    <g fill="#e5e7eb">
      <rect x="40" y="100" width="18" height="40"/><rect x="60" y="100" width="18" height="40"/>
      <rect x="80" y="100" width="18" height="40"/><rect x="100" y="100" width="18" height="40"/>
      <rect x="120" y="100" width="18" height="40"/><rect x="140" y="100" width="18" height="40"/>
      <rect x="160" y="100" width="18" height="40"/><rect x="180" y="100" width="18" height="40"/>
      <rect x="200" y="100" width="18" height="40"/><rect x="220" y="100" width="18" height="40"/>
      <rect x="240" y="100" width="18" height="40"/><rect x="260" y="100" width="18" height="40"/>
      <rect x="280" y="100" width="18" height="40"/><rect x="300" y="100" width="18" height="40"/>
      <rect x="320" y="100" width="18" height="40"/><rect x="340" y="100" width="18" height="40"/>
    </g>
    <!-- keyword window cells 17-19 (purple) -->
    <g fill="#e9d5ff">
      <rect x="360" y="100" width="18" height="40"/><rect x="380" y="100" width="18" height="40"/>
      <rect x="400" y="100" width="18" height="40"/>
    </g>
    <!-- dropped cells 20-30 -->
    <g fill="#e5e7eb">
      <rect x="420" y="100" width="18" height="40"/><rect x="440" y="100" width="18" height="40"/>
      <rect x="460" y="100" width="18" height="40"/><rect x="480" y="100" width="18" height="40"/>
      <rect x="500" y="100" width="18" height="40"/><rect x="520" y="100" width="18" height="40"/>
      <rect x="540" y="100" width="18" height="40"/><rect x="560" y="100" width="18" height="40"/>
      <rect x="580" y="100" width="18" height="40"/><rect x="600" y="100" width="18" height="40"/>
      <rect x="620" y="100" width="18" height="40"/>
    </g>
    <!-- heading cell 31 (dark, anchor) -->
    <rect x="640" y="100" width="18" height="40" fill="#1e3a8a"/>
    <!-- limitations span cells 32-38 (blue) -->
    <g fill="#bfdbfe">
      <rect x="660" y="100" width="18" height="40"/><rect x="680" y="100" width="18" height="40"/>
      <rect x="700" y="100" width="18" height="40"/><rect x="720" y="100" width="18" height="40"/>
      <rect x="740" y="100" width="18" height="40"/><rect x="760" y="100" width="18" height="40"/>
      <rect x="780" y="100" width="18" height="40"/>
    </g>
    <!-- tail-only cells 39-40 (green) -->
    <g fill="#bbf7d0">
      <rect x="800" y="100" width="18" height="40"/><rect x="820" y="100" width="18" height="40"/>
    </g>
  </g>
  <text x="40" y="156" class="sm">1</text>
  <text x="828" y="156" class="sm">N</text>
  <text x="190" y="156" class="sm" fill="#9ca3af">intro · methods · results  (dropped ≈ 82%)</text>
  <text x="645" y="156" class="sm" fill="#1e3a8a">heading</text>

  <!-- union arrow -->
  <text x="20" y="240" class="s">↓ union (highest-priority tag wins per sentence) → contiguous runs become Regions</text>

  <!-- regions -->
  <rect x="360" y="260" width="58" height="44" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="389" y="285" text-anchor="middle" class="lbl" fill="#7c3aed">Region A</text>
  <text x="389" y="320" text-anchor="middle" class="sm">future_work</text>

  <rect x="640" y="260" width="200" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="740" y="280" text-anchor="middle" class="lbl" fill="#2563eb">Region B  (limitations)</text>
  <text x="740" y="297" text-anchor="middle" class="sm">heading span ∪ tail · is_terminal = true · heading excluded as candidate</text>

  <!-- legend -->
  <g transform="translate(20,350)">
    <text x="0" y="0" class="t" font-size="13px">Legend</text>
    <rect x="0" y="12" width="16" height="14" fill="#e5e7eb" class="cell"/><text x="22" y="24" class="sm">dropped (never seen by Stage B)</text>
    <rect x="240" y="12" width="16" height="14" fill="#e9d5ff" class="cell"/><text x="262" y="24" class="sm">inline-keyword window (±5)</text>
    <rect x="470" y="12" width="16" height="14" fill="#bfdbfe" class="cell"/><text x="492" y="24" class="sm">heading-anchored span (+40)</text>
    <rect x="0" y="36" width="16" height="14" fill="#bbf7d0" class="cell"/><text x="22" y="48" class="sm">terminal tail (last 30)</text>
    <rect x="240" y="36" width="16" height="14" fill="#1e3a8a" class="cell"/><text x="262" y="48" class="sm">heading unit (anchor, not a candidate)</text>
  </g>

  <text x="20" y="445" class="sm" fill="#6b7280">Priority on overlap: limitations(3) &gt; future_work(2) &gt; discussion(1) &gt; tail(0).  Mid-paper "Discussion" anchors before 45% are gated out; Limitations/Future-Work and the tail are kept anywhere.</text>
</svg>
